name: sprintmission11
services:
  server:
    image: hyentaejang/sprintmission11_serverimage
    build:
      tags:
        - hyentaejang/sprintmission11
      args:
        - NODE_VERSION=20.12.1
      dockerfile: Dockerfile
      pull: true
      context: .
    container_name: sprintmission11_container
    environment:
      - SERVER_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DB_HOST}:${POSTGRES_DB_PORT}/${POSTGRES_DB}?schema=public
    ports:
      - "3000:3000"
    networks:
      - network-a
    volumes:
      - uploadFiles:/app/uploads:rw
  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5434:5432"
    networks:
      - network-a

networks:
  network-a:

volumes:
  uploadFiles:
