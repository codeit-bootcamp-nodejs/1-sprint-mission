version: '3.8'

services:
  server:
    build: .
    container_name: express-app
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
    environment:
      - DATABASE_URL=postgresql://yutaek:dbxor1401%21@db:5432/pandamarket
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: yutaek
      POSTGRES_PASSWORD: dbxor1401
      POSTGRES_DB: pandamarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  postgres_data: